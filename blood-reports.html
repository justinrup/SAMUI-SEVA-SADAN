<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blood Reports</title>
<style>
body{font-family:Arial;background:#f4f7fb;margin:0;padding:20px}
.card{max-width:700px;margin:auto;background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #ccc}
input,textarea{width:100%;padding:10px;margin:7px 0 14px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px}
button{padding:10px 15px;margin:4px;border:0;border-radius:6px;cursor:pointer}
.save{background:#168a3b;color:white}.back{background:#555;color:white}
.edit{background:#1677d2;color:white}.publish{background:#8a5a00;color:white}.delete{background:#c62828;color:white}
.record{border:1px solid #ddd;padding:15px;margin-top:12px;border-radius:8px}
.pub{color:green;font-weight:bold}.unpub{color:#c00;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>🩸 Blood Reports</h2>

<input id="patientName" placeholder="Patient Name">
<input id="patientId" placeholder="Patient ID / SL No">
<input id="reportDate" type="date">
<input id="testName" placeholder="Test Name">
<textarea id="result" rows="5" placeholder="Result / Report Details"></textarea>
<input id="reportFile" type="file">

<button class="save" onclick="saveReport()">💾 Save Report</button>
<button class="back" onclick="location.href='admin-dashboard.html'">⬅️ Back to Admin Panel</button>

<h2>📋 Saved Reports</h2>
<div id="records"></div>
</div>

<script>
let editIndex=-1;

function getRecords(){
 return JSON.parse(localStorage.getItem("bloodReports")||"[]");
}

function saveReport(){
 let records=getRecords();
 let fileName=reportFile.files.length?reportFile.files[0].name:"";
 let data={
  patientName:patientName.value,
  patientId:patientId.value,
  reportDate:reportDate.value,
  testName:testName.value,
  result:result.value,
  fileName:fileName,
  published:false
 };
 if(editIndex>=0){
  data.published=records[editIndex].published||false;
  if(!fileName)data.fileName=records[editIndex].fileName||"";
  records[editIndex]=data;
  editIndex=-1;
 }else records.push(data);
 localStorage.setItem("bloodReports",JSON.stringify(records));
 clearForm();
 loadRecords();
 alert("Blood report saved.");
}

function editRecord(i){
 let r=getRecords()[i];
 patientName.value=r.patientName||"";
 patientId.value=r.patientId||"";
 reportDate.value=r.reportDate||"";
 testName.value=r.testName||"";
 result.value=r.result||"";
 editIndex=i;
 window.scrollTo(0,0);
}

function publishRecord(i){
 let records=getRecords();
 records[i].published=!records[i].published;
 localStorage.setItem("bloodReports",JSON.stringify(records));
 loadRecords();
}

function deleteRecord(i){
 if(!confirm("Delete this report?"))return;
 let records=getRecords();
 records.splice(i,1);
 localStorage.setItem("bloodReports",JSON.stringify(records));
 loadRecords();
}

function clearForm(){
 patientName.value="";patientId.value="";reportDate.value="";
 testName.value="";result.value="";reportFile.value="";
}

function loadRecords(){
 let records=getRecords();
 let box=document.getElementById("records");
 box.innerHTML=records.length?"":"<p>No reports saved.</p>";
 records.forEach((r,i)=>{
  box.innerHTML+=`<div class="record">
  <b>Patient:</b> ${r.patientName||"-"}<br>
  <b>ID:</b> ${r.patientId||"-"}<br>
  <b>Report Date:</b> ${r.reportDate||"-"}<br>
  <b>Test:</b> ${r.testName||"-"}<br>
  <b>Result:</b> ${r.result||"-"}<br>
  <b>File:</b> ${r.fileName||"No file"}<br>
  <p class="${r.published?'pub':'unpub'}">${r.published?'📢 Published':'🔒 Unpublished'}</p>
  <button class="edit" onclick="editRecord(${i})">✏️ Edit</button>
  <button class="publish" onclick="publishRecord(${i})">${r.published?'↩️ Unpublish':'📢 Publish'}</button>
  <button class="delete" onclick="deleteRecord(${i})">🗑️ Delete</button>
  </div>`;
 });
}
loadRecords();
</script>
</body>
</html>
