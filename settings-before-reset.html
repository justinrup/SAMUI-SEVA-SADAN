<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Settings - SAMUI SEVA SADAN</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#eef9ff,#f7fcff);
 color:#183b4d
}
.header{
 background:linear-gradient(135deg,#075985,#0e7490);
 color:white;padding:22px 16px;text-align:center
}
.header h1{margin:0;font-size:24px}
.header p{margin:7px 0 0;font-size:14px}
.container{max-width:650px;margin:auto;padding:18px 14px}
.card{
 background:white;border-radius:18px;padding:18px;margin-bottom:14px;
 box-shadow:0 5px 20px rgba(0,80,120,.10)
}
.card h2{margin:0 0 14px;font-size:19px;color:#075985}
.option{
 width:100%;display:flex;align-items:center;justify-content:space-between;
 padding:14px 12px;margin:8px 0;border:1px solid #cce7f2;
 border-radius:13px;background:#f4fbff;cursor:pointer;font-size:15px
}
.option.active{border:2px solid #0284c7;background:#e0f2fe}
.option span:last-child{font-weight:bold}
.back{
 display:block;text-align:center;text-decoration:none;
 background:#075985;color:white;padding:14px;border-radius:13px;
 margin-top:10px
}
.small{font-size:13px;color:#567}
</style>
</head>

<body>

<div class="header">
 <h1>⚙️ Settings</h1>
 <p>SAMUI SEVA SADAN</p>
</div>

<div class="container">

<div class="card">
<h2>🌐 Language / ভাষা / भाषा</h2>
<button class="option" data-group="language" data-value="en">
<span>🇬🇧 English</span><span>›</span>
</button>
<button class="option" data-group="language" data-value="bn">
<span>🇮🇳 বাংলা</span><span>›</span>
</button>
<button class="option" data-group="language" data-value="hi">
<span>🇮🇳 हिन्दी</span><span>›</span>
</button>
</div>

<div class="card">
<h2>🔤 Font Size / লেখা ছোট-বড়</h2>
<button class="option" data-group="fontSize" data-value="small">
<span>Small</span><span>A</span>
</button>
<button class="option" data-group="fontSize" data-value="medium">
<span>Medium</span><span>A</span>
</button>
<button class="option" data-group="fontSize" data-value="large">
<span>Large</span><span>A</span>
</button>
<button class="option" data-group="fontSize" data-value="xlarge">
<span>Extra Large</span><span>A</span>
</button>
</div>

<div class="card">
<h2>🎨 Text Color / লেখার রং</h2>
<button class="option" data-group="textColor" data-value="dark">
<span>⚫ Dark</span><span>›</span>
</button>
<button class="option" data-group="textColor" data-value="blue">
<span>🔵 Blue</span><span>›</span>
</button>
<button class="option" data-group="textColor" data-value="green">
<span>🟢 Green</span><span>›</span>
</button>
<button class="option" data-group="textColor" data-value="red">
<span>🔴 Red</span><span>›</span>
</button>
</div>

<div class="card">
<h2>✍️ Text Style / লেখার স্টাইল</h2>
<button class="option" data-group="textStyle" data-value="normal">
<span>Normal</span><span>›</span>
</button>
<button class="option" data-group="textStyle" data-value="bold">
<span>Bold</span><span>›</span>
</button>
<button class="option" data-group="textStyle" data-value="modern">
<span>Modern</span><span>›</span>
</button>
<button class="option" data-group="textStyle" data-value="classic">
<span>Classic</span><span>›</span>
</button>
</div>

<div class="card">
<h2>🖥️ Page Style / Page Theme</h2>
<button class="option" data-group="theme" data-value="default">
<span>Default</span><span>›</span>
</button>
<button class="option" data-group="theme" data-value="blue">
<span>Soft Blue</span><span>›</span>
</button>
<button class="option" data-group="theme" data-value="green">
<span>Soft Green</span><span>›</span>
</button>
<button class="option" data-group="theme" data-value="light">
<span>Light</span><span>›</span>
</button>
</div>

<a class="back" href="index.html">🏠 Back to Home</a>

</div>

<script>
const defaults={
 language:"en",
 fontSize:"medium",
 textColor:"dark",
 textStyle:"normal",
 theme:"default"
};

function getSetting(key){
 return localStorage.getItem("sss_"+key) || defaults[key];
}

function saveSetting(key,value){
 localStorage.setItem("sss_"+key,value);
}

function updateActive(){
 document.querySelectorAll(".option").forEach(btn=>{
   const group=btn.dataset.group;
   const value=btn.dataset.value;
   btn.classList.toggle("active",getSetting(group)===value);
 });
}

document.querySelectorAll(".option").forEach(btn=>{
 btn.addEventListener("click",()=>{
   saveSetting(btn.dataset.group,btn.dataset.value);
   updateActive();
 });
});

updateActive();
</script>

</body>
</html>
