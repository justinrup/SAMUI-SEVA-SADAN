<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Samui Seva Sadan</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <div>
    <h1>SAMUI SEVA SADAN</h1>
    <p>Administration Panel</p>
  </div>
</header>

<section>
  <div class="card" style="max-width:420px;margin:auto;">
    <h2>🔐 Admin Login</h2>

    <form id="adminLoginForm">

      <label for="email">Admin Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        required
        style="width:100%;padding:13px;margin:8px 0 15px;border:1px solid #bbb;border-radius:8px;"
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
        style="width:100%;padding:13px;margin:8px 0 15px;border:1px solid #bbb;border-radius:8px;"
      >

      <button type="submit" style="width:100%;">
        Login
      </button>

      <p id="loginMessage"></p>

    </form>
  </div>
</section>

<footer>
  <p>© 2026 Samui Seva Sadan Nursing Home</p>
</footer>

<script type="module" src="js/app.js"></script>

</body>
</html>
