<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  updateDoc,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeJryLHlGc9Mx_kpo1IhmqnLC5EVYGBvM",
  authDomain: "samui-seva-sadan.firebaseapp.com",
  projectId: "samui-seva-sadan",
  storageBucket: "samui-seva-sadan.firebasestorage.app",
  messagingSenderId: "358488171058",
  appId: "1:358488171058:web:8be9c94e38f6618049522b",
  measurementId: "G-ML4BQ4QVLB"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadBirthReportForEdit(){
  const params = new URLSearchParams(location.search);
  const editId = params.get("edit");

  if(!editId) return;

  const status = document.getElementById("status");

  try{
    if(status) status.textContent = "Birth Report loading...";

    const snap = await getDoc(
      doc(db, "birth_reports", editId)
    );

    if(!snap.exists()){
      if(status) status.textContent = "Birth Report পাওয়া যায়নি";
      return;
    }

    const data = snap.data();
    const form = document.getElementById("birthForm");

    form.querySelectorAll("input, textarea, select").forEach(el => {
      if(el.type === "file") return;

      const value = data[el.name];

      if(el.type === "radio" || el.type === "checkbox"){
        if(Array.isArray(value)){
          el.checked = value.includes(el.value);
        }else{
          el.checked = String(value ?? "") === String(el.value);
        }
      }else if(value !== undefined){
        el.value = value;
      }
    });

    if(data.language && document.getElementById("language")){
      document.getElementById("language").value = data.language;

      if(typeof setLanguage === "function"){
        setLanguage(data.language);
      }
    }

    if(status) status.textContent = "Edit mode: Birth Report loaded ✓";

  }catch(error){
    console.error("BIRTH REPORT EDIT LOAD ERROR:", error);

    if(status){
      status.textContent = "Birth Report load failed: " + (error.message || error);
    }
  }
}

loadBirthReportForEdit();

</script>

function setLanguage(lang){
 const t=T[lang]||T.bn;
 document.documentElement.lang=lang;
 Object.keys(t).forEach(k=>{
   const el=document.getElementById(k); if(el) el.textContent=t[k];
 });
 document.querySelectorAll("[data-i]").forEach(el=>{
   const key=el.dataset.i; if(t[key]) el.textContent=t[key];
 });
 document.querySelectorAll("option[data-opt]").forEach(el=>{
   const key=el.dataset.opt;
   if(t[key]) el.textContent=t[key];
 });
 localStorage.setItem("birthReportLanguage",lang);
}
document.getElementById("birthForm").addEventListener("submit",async function(e){
  e.preventDefault();

  const s = document.getElementById("status");
  const form = document.getElementById("birthForm");
  const data = {};

  form.querySelectorAll("input, textarea, select").forEach(el => {
    if(el.type === "file") return;

    if(el.type === "radio" || el.type === "checkbox"){
      if(el.checked){
        if(data[el.name]){
          if(!Array.isArray(data[el.name])) data[el.name] = [data[el.name]];
          data[el.name].push(el.value);
        }else{
          data[el.name] = el.value;
        }
      }
    }else{
      data[el.name] = el.value;
    }
  });

  data.language = document.getElementById("language")?.value || "bn";
  data.updatedAt = new Date().toISOString();

  try{
    s.textContent = "সংরক্ষণ করা হচ্ছে...";

    const params = new URLSearchParams(location.search);
    const editId = params.get("edit");

    if(editId){
      await updateDoc(
        doc(db, "birth_reports", editId),
        data
      );

      s.textContent = "জন্ম প্রতিবেদন সফলভাবে Update হয়েছে ✓";

    }else{
      data.createdAt = new Date().toISOString();
      data.published = false;

      const ref = await addDoc(
        collection(db, "birth_reports"),
        data
      );

      s.textContent = "জন্ম প্রতিবেদন সফলভাবে সংরক্ষণ হয়েছে ✓ ID: " + ref.id;
      form.reset();
    }

  }catch(error){
    console.error("BIRTH REPORT SAVE/UPDATE ERROR:", error);
    s.textContent = "সংরক্ষণ করা যায়নি: " + (error.message || error);
  }
});
setLanguage(localStorage.getItem("birthReportLanguage")||"bn");
</script>
