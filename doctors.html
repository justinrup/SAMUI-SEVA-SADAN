<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doctors | Samui Seva Sadan</title>

<link rel="stylesheet" href="css/style.css">

<style>
.doctors-container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.doctor-card{
  background:#fff;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
}

.doctor-card h3{
  margin-top:0;
  color:#008f95;
  font-size:22px;
}

.doctor-card p{
  margin:8px 0;
  line-height:1.5;
}

.doctor-photo{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:10px;
  display:block;
  margin-bottom:15px;
  border:1px solid #ddd;
}

.attachment{
  display:inline-block;
  margin-top:8px;
  padding:9px 14px;
  background:#008f95;
  color:#fff;
  text-decoration:none;
  border-radius:7px;
}

.loading{
  text-align:center;
  padding:30px;
}

.no-doctors{
  text-align:center;
  padding:30px;
  background:#fff;
  border-radius:12px;
}
</style>
</head>

<body>

<header>
  <div>
    <h1>SAMUI SEVA SADAN</h1>
    <p>Nursing Home & Healthcare Centre</p>
  </div>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About Us</a>
  <a href="services.html">Services</a>
  <a href="doctors.html">Doctors</a>
  <a href="facilities.html">Facilities</a>
  <a href="contact.html">Contact</a>
</nav>

<section>
  <div class="doctors-container">

    <h2>Our Doctors & Medical Team</h2>

    <div id="doctorsList">
      <div class="loading">
        Loading doctors...
      </div>
    </div>

  </div>
</section>

<footer>
  <p>© 2026 Samui Seva Sadan Nursing Home</p>
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey:"AIzaSyDeJryLHlGc9Mx_kpo1IhmqnLC5EVYGBvM",
  authDomain:"samui-seva-sadan.firebaseapp.com",
  projectId:"samui-seva-sadan",
  storageBucket:"samui-seva-sadan.firebasestorage.app",
  messagingSenderId:"358488171058",
  appId:"1:358488171058:web:8be9c94e38f6618049522b",
  measurementId:"G-ML4BQ4QVLB"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const doctorsList = document.getElementById("doctorsList");


function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function dataUrlToBlobUrl(dataUrl){

  try{

    const parts = dataUrl.split(",");
    const meta = parts[0];
    const base64 = parts[1];

    const mimeMatch = meta.match(/data:([^;]+);base64/);
    const mime = mimeMatch ? mimeMatch[1] : "application/octet-stream";

    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);

    for(let i=0;i<binary.length;i++){
      bytes[i] = binary.charCodeAt(i);
    }

    const blob = new Blob([bytes],{type:mime});

    return URL.createObjectURL(blob);

  }catch(error){

    console.error("Doctor photo conversion error:",error);
    return "";

  }
}


async function loadDoctors(){

  try{

    const snapshot = await getDocs(
      collection(db,"doctors")
    );

    const doctors = [];

    snapshot.forEach(docSnap => {

      const d = docSnap.data();

      if(d.published === true){

        doctors.push(d);

      }

    });


    if(doctors.length === 0){

      doctorsList.innerHTML = `
        <div class="no-doctors">
          <h3>Medical Team</h3>
          <p>Doctor information will be available here soon.</p>
        </div>
      `;

      return;

    }


    doctorsList.innerHTML = doctors.map(d => {

      let attachmentHTML = "";

      if(!d.attachment){
        attachmentHTML = `
          <div style="padding:15px;background:#f8d7da;border:1px solid #dc3545;border-radius:8px;color:#842029;">
            <b>DEBUG: attachment NOT FOUND</b>
          </div>
        `;
      }else if(!d.attachment.data){
        attachmentHTML = `
          <div style="padding:15px;background:#fff3cd;border:1px solid #ffc107;border-radius:8px;color:#664d03;">
            <b>DEBUG: attachment found, but data NOT FOUND</b>
          </div>
        `;
      }else{
        const debugData = String(d.attachment.data);
        attachmentHTML = `
          <div style="padding:10px;background:#d1ecf1;border:1px solid #0c5460;border-radius:8px;color:#0c5460;margin-bottom:10px;">
            <b>DEBUG: Photo data received</b><br>
            Data length: ${debugData.length}<br>
            Starts with: ${esc(debugData.substring(0,40))}
          </div>
        `;
      }

      if(d.attachment && d.attachment.data){

        if(
          d.attachment.type &&
          d.attachment.type.startsWith("image/")
        ){

          const photoData = String(d.attachment.data || "");
          const photoUrl = dataUrlToBlobUrl(photoData);

          if(!photoUrl){

            attachmentHTML = `
              <div style="padding:15px;background:#fff3cd;border:1px solid #ffc107;border-radius:8px;color:#664d03;">
                <b>⚠️ Doctor Photo Data Error</b>
                <br>
                Data length: ${photoData.length}
                <br>
                Starts with: ${esc(photoData.substring(0,40))}
              </div>
            `;

          }else{

            attachmentHTML = `
              <img
                class="doctor-photo"
                src="${photoUrl}"
                alt="${esc(d.name || "Doctor")}"
              >

              <a
                class="attachment"
                href="${photoUrl}"
                download="${esc(d.attachment.name || "doctor-photo.jpg")}"
                target="_blank"
              >
                📎 View / Download Photo
              </a>
            `;

          }

        }else{

          attachmentHTML = `
            <a
              class="attachment"
              href="${d.attachment.data}"
              download="${esc(d.attachment.name || "document")}"
              target="_blank"
            >
              📎 View / Download Document
            </a>
          `;

        }

      }


      return `
        <div class="doctor-card">

          ${attachmentHTML}

          <h3>👨‍⚕️ ${esc(d.name)}</h3>

          <p>
            <b>🏥 Hospital:</b>
            ${esc(d.hospitalName)}
          </p>

          <p>
            <b>🩺 Specialist:</b>
            ${esc(d.specialist)}
          </p>

          <p>
            <b>🎓 Qualification:</b>
            ${esc(d.qualification)}
          </p>

          <p>
            <b>📅 Available From:</b>
            ${esc(d.addedOnHospital)}
          </p>

          <p>
            <b>🕐 DOCTOR CHAMBER TIME:</b>
            ${esc(d.doctorTime)}
          </p>

        </div>
      `;

    }).join("");


  }catch(error){

    console.error(error);

    doctorsList.innerHTML = `
      <div class="no-doctors">
        <h3>Unable to load doctors</h3>
        <p>Please try again later.</p>
      </div>
    `;

  }

}


loadDoctors();

</script>

</body>
</html>
