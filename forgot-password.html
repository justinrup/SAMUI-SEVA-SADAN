<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - SAMUI SEVA SADAN</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f8f9;
  color:#123;
}

.header{
  background:#087f8c;
  color:#fff;
  padding:22px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:24px;
}

.header p{
  margin:6px 0 0;
  font-size:14px;
}

.container{
  max-width:500px;
  margin:30px auto;
  padding:0 18px;
}

.card{
  background:#fff;
  padding:25px 22px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
}

h2{
  text-align:center;
  color:#087f8c;
  margin-top:0;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#087f8c;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:#aaa;
}

#message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}

.section{
  margin-top:20px;
  padding-top:15px;
  border-top:1px solid #ddd;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#555;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
<h1>🔐 PASSWORD RECOVERY</h1>
<p>SAMUI SEVA SADAN NURSING HOME</p>
</div>

<div class="container">
<div class="card">

<h2>Forgot Password</h2>

<!-- EMAIL -->
<label>📧 Recovery Email</label>
<input
  type="email"
  id="email"
  placeholder="Enter recovery email"
>

<button id="sendBtn" onclick="sendOTP()">
📨 SEND OTP
</button>


<!-- OTP -->
<div id="otpSection" class="section" style="display:none">

<label>🔢 Enter OTP</label>

<input
  type="text"
  id="otp"
  maxlength="6"
  inputmode="numeric"
  placeholder="6 digit OTP"
>

<button id="verifyBtn" onclick="verifyOTP()">
✅ VERIFY OTP
</button>

</div>


<!-- NEW PASSWORD -->
<div id="passwordSection" class="section" style="display:none">

<label>🔑 New Password</label>

<input
  type="password"
  id="newPassword"
  placeholder="Enter new password"
>

<label>🔑 Confirm New Password</label>

<input
  type="password"
  id="confirmPassword"
  placeholder="Confirm new password"
>

<button id="resetBtn" onclick="resetPassword()">
🔄 RESET PASSWORD
</button>

</div>


<div id="message"></div>

<a class="back" href="admin-login.html">
← Back to Admin Login
</a>

</div>
</div>


<script>

let otpVerified = false;


/* SEND OTP */
async function sendOTP(){

  const email =
    document.getElementById("email").value.trim();

  const msg =
    document.getElementById("message");

  const btn =
    document.getElementById("sendBtn");


  if(!email){

    msg.textContent =
      "❌ Please enter your recovery email.";

    return;
  }


  btn.disabled = true;
  btn.textContent = "Sending OTP...";

  msg.textContent = "Sending OTP...";


  try{

    const res = await fetch("/api/send-otp",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        email:email
      })

    });


    const data = await res.json();


    if(data.ok){

      msg.textContent =
        "✅ OTP sent to your email.";

      document.getElementById(
        "otpSection"
      ).style.display="block";

    }else{

      msg.textContent =
        "❌ " + (data.message || "Failed to send OTP.");

    }

  }catch(e){

    console.error(e);

    msg.textContent =
      "❌ Server connection error.";

  }


  btn.disabled = false;
  btn.textContent = "📨 SEND OTP";
}



/* VERIFY OTP */
async function verifyOTP(){

  const email =
    document.getElementById("email").value.trim();

  const otp =
    document.getElementById("otp").value.trim();

  const msg =
    document.getElementById("message");

  const btn =
    document.getElementById("verifyBtn");


  if(otp.length !== 6){

    msg.textContent =
      "❌ Please enter the 6 digit OTP.";

    return;
  }


  btn.disabled = true;
  btn.textContent = "Verifying...";

  msg.textContent = "Verifying OTP...";


  try{

    const res = await fetch("/api/verify-otp",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        email:email,
        otp:otp
      })

    });


    const data = await res.json();


    if(data.ok){

      otpVerified = true;

      msg.textContent =
        "✅ OTP verified. Now create a new password.";

      document.getElementById(
        "passwordSection"
      ).style.display="block";

      document.getElementById(
        "otp"
      ).disabled=true;

      btn.disabled=true;

      btn.textContent="✅ OTP VERIFIED";

    }else{

      msg.textContent =
        "❌ " + (data.message || "Invalid OTP.");

      btn.disabled=false;
      btn.textContent="✅ VERIFY OTP";

    }

  }catch(e){

    console.error(e);

    msg.textContent =
      "❌ Server connection error.";

    btn.disabled=false;
    btn.textContent="✅ VERIFY OTP";

  }

}



/* RESET PASSWORD */
async function resetPassword(){

  const email =
    document.getElementById("email").value.trim();

  const newPassword =
    document.getElementById("newPassword").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const msg =
    document.getElementById("message");

  const btn =
    document.getElementById("resetBtn");


  if(!otpVerified){

    msg.textContent =
      "❌ Please verify OTP first.";

    return;
  }


  if(newPassword.length < 6){

    msg.textContent =
      "❌ Password must be at least 6 characters.";

    return;
  }


  if(newPassword !== confirmPassword){

    msg.textContent =
      "❌ Passwords do not match.";

    return;
  }


  btn.disabled=true;
  btn.textContent="Resetting...";

  msg.textContent="Resetting password...";


  try{

    const res = await fetch("/api/reset-password",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        email:email,

        new_password:newPassword

      })

    });


    const data = await res.json();


    if(data.ok){

      msg.textContent =
        "✅ Password reset successfully! Redirecting...";

      setTimeout(function(){

        window.location.href =
          "admin-login.html";

      },2000);

    }else{

      msg.textContent =
        "❌ " + (data.message || "Password reset failed.");

      btn.disabled=false;
      btn.textContent="🔄 RESET PASSWORD";

    }

  }catch(e){

    console.error(e);

    msg.textContent =
      "❌ Server connection error.";

    btn.disabled=false;
    btn.textContent="🔄 RESET PASSWORD";

  }

}

</script>

</body>
</html>
