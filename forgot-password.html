










<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password - SAMUI SEVA SADAN</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f8f9;
  color:#123;
}

.header{
  background:#087f8c;
  color:white;
  padding:22px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:24px;
}

.header p{
  margin:6px 0 0;
  font-size:14px;
}

.container{
  max-width:500px;
  margin:30px auto;
  padding:0 18px;
}

.card{
  background:white;
  padding:25px 22px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
}

h2{
  text-align:center;
  color:#087f8c;
  margin-top:0;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#087f8c;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.verify{
  background:#198754;
}

.reset{
  background:#dc3545;
}

.section{
  margin-top:20px;
  padding-top:10px;
  border-top:1px solid #ddd;
}

#message{
  text-align:center;
  margin-top:18px;
  font-weight:bold;
  min-height:22px;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#555;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
  <h1>🔐 PASSWORD RECOVERY</h1>
  <p>SAMUI SEVA SADAN NURSING HOME</p>
</div>

<div class="container">

<div class="card">

<h2>Forgot Password</h2>

<!-- EMAIL -->
<label>📧 Recovery Email</label>

<input
  type="email"
  id="email"
  placeholder="Enter recovery email"
>

<button onclick="sendOTP()">
📨 SEND OTP
</button>


<!-- OTP -->
<div class="section">

<label>🔢 Enter OTP</label>

<input
  type="text"
  id="otp"
  maxlength="6"
  inputmode="numeric"
  placeholder="Enter 6 digit OTP"
>

<button class="verify" onclick="verifyOTP()">
✅ VERIFY OTP
</button>

</div>


<!-- NEW PASSWORD -->
<div class="section">

<label>🔑 New Password</label>

<input
  type="password"
  id="newPassword"
  placeholder="Enter new password"
>

<label>🔑 Confirm New Password</label>

<input
  type="password"
  id="confirmPassword"
  placeholder="Confirm new password"
>

<button class="reset" onclick="resetPassword()">
🔄 RESET PASSWORD
</button>

</div>


<div id="message"></div>

<a class="back" href="admin-login.html">
← Back to Admin Login
</a>

</div>
</div>


<script>

let otpVerified = false;


/* =========================
   SEND OTP
========================= */

async function sendOTP(){

  const email =
    document.getElementById("email").value.trim();

  const msg =
    document.getElementById("message");

  if(!email){

    msg.textContent =
      "❌ Please enter your recovery email.";

    return;
  }

  msg.textContent =
    "📨 Sending OTP...";

  try{

    const res = await fetch(
      "/api/send-otp",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email:email
        })
      }
    );

    const data = await res.json();

    if(data.ok){

      msg.textContent =
        "✅ OTP sent to your email.";

    }else{

      msg.textContent =
        "❌ " + data.message;
    }

  }catch(error){

    msg.textContent =
      "❌ Server connection error.";
  }
}


/* =========================
   VERIFY OTP
========================= */

async function verifyOTP(){

  const email =
    document.getElementById("email").value.trim();

  const otp =
    document.getElementById("otp").value.trim();

  const msg =
    document.getElementById("message");

  if(!email){

    msg.textContent =
      "❌ Please enter your recovery email.";

    return;
  }

  if(otp.length !== 6){

    msg.textContent =
      "❌ Please enter the 6 digit OTP.";

    return;
  }

  msg.textContent =
    "🔄 Verifying OTP...";

  try{

    const res = await fetch(
      "/api/verify-otp",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email:email,
          otp:otp
        })
      }
    );

    const data = await res.json();

    if(data.ok){

      otpVerified = true;

      msg.textContent =
        "✅ OTP verified. You can now reset your password.";

    }else{

      otpVerified = false;

      msg.textContent =
        "❌ " + data.message;
    }

  }catch(error){

    msg.textContent =
      "❌ Server connection error.";
  }
}


/* =========================
   RESET PASSWORD
========================= */

async function resetPassword(){

  const email =
    document.getElementById("email").value.trim();

  const newPassword =
    document.getElementById("newPassword").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const msg =
    document.getElementById("message");


  if(!email){

    msg.textContent =
      "❌ Please enter your recovery email.";

    return;
  }


  if(!otpVerified){

    msg.textContent =
      "❌ Please verify OTP first.";

    return;
  }


  if(newPassword.length < 6){

    msg.textContent =
      "❌ Password must be at least 6 characters.";

    return;
  }


  if(newPassword !== confirmPassword){

    msg.textContent =
      "❌ Passwords do not match.";

    return;
  }


  msg.textContent =
    "🔄 Resetting password...";


  try{

    const res = await fetch(
      "/api/reset-password",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email:email,
          new_password:newPassword
        })
      }
    );


    const data = await res.json();


    if(data.ok){

      msg.textContent =
        "✅ Password reset successfully!";

      otpVerified = false;


      setTimeout(function(){

        window.location.href =
          "admin-login.html";

      },1500);


    }else{

      msg.textContent =
        "❌ " + data.message;
    }


  }catch(error){

    msg.textContent =
      "❌ Server connection error.";
  }

}

</script>

</body>
</html>
